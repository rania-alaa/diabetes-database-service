version: "3.2"

services:
  mongo:
    image: mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongo_volume:/data/db
      - ./database_setup/mongo-setup/mongod.conf:/etc/mongo/mongod.conf  # Mount the config file
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]  # Tell MongoDB to use the
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - mynetwork

  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      - mongo
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - mynetwork

  postgresql_db:
    image: postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgresql_volume:/var/lib/postgresql/data
      - ./database_setuo/postgresql-setup/postgresql.conf:/etc/postgresql/postgresql.conf  # Mount config
      - ./init-scripts:/docker-entrypoint-initdb.d  # Mount SQL scripts here

    command:  ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]  # Use the custom config file
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: user1
      POSTGRES_DB: tododb
    networks:
      - mynetwork

  adminer:
    image: adminer
    restart: always
    depends_on: 
      - postgres_db
    ports:
      - 8080:8080
    networks:
      - mynetwork


volumes:
  mongo_volume:
  postgresql_volume:  


networks:
  mynetwork:
    driver: bridge
